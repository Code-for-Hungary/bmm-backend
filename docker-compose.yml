services:
  app:
    build: .
    restart: always
    # Podman-specific (remove for Docker). With the default bridge network, podman has to
    # kill a shared pasta process on teardown, which the host's AppArmor policy blocks;
    # a per-container pasta exits on its own.
    network_mode: pasta
    env_file: .env
    environment:
      # Use the host's MariaDB through its unix socket; DB_HOST/DB_PORT are then ignored
      DB_SOCKET: /run/mysqld/mysqld.sock
    ports:
      # Only reachable from the host; a reverse proxy in front handles the domain and TLS
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - logs:/var/www/html/storage/logs
      # The directory rather than the socket file, so a MariaDB restart (new socket) is picked up
      - /run/mysqld:/run/mysqld:ro

volumes:
  logs:
