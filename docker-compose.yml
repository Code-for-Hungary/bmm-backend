services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      # .env may point at a database outside Docker; inside, it is always the db service
      DB_HOST: db
      DB_PORT: 3306
    ports:
      # Only reachable from the host; a reverse proxy in front handles the domain and TLS
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    build: docker/mariadb
    restart: always
    # basedir would otherwise follow the relocated binary (see docker/mariadb/Dockerfile);
    # the collation matches the one Laravel uses for its tables
    command: --basedir=/usr --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db-data:
  logs:
